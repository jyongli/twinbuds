plugins { id 'com.android.application' }

android {
    namespace 'com.jy.twinbuds'
    compileSdk 36
    defaultConfig {
        applicationId 'com.jy.twinbuds'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    // 4.15.1 保留 API 21 测试支持；框架模拟不能替代真机蓝牙验证。
    testImplementation 'org.robolectric:robolectric:4.15.1'
}

tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    systemProperty 'twinbuds.screenshots', rootProject.file('artifacts/screenshots').absolutePath
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
